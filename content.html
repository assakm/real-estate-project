<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Details</title>
  <style>
    body {
      margin: 0;
      background-color: #0f1123;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    .header {
      background-color: #1a1b1f;
      padding: 16px 20px;
      font-size: 22px;
      font-weight: bold;
      color: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .add-button {
      position: absolute;
      right: 20px;
      top: 10px;
      background-color: orange;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 22px;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .add-button:hover {
      background-color: #ff8c00;
    }

    .container {
      padding: 20px;
    }

    .search-bar {
      width: 100%;
      background-color: #1e1f2a;
      border: none;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      margin-bottom: 20px;
      color: white;
      box-sizing: border-box;
    }

    .search-bar::placeholder {
      color: #aaa;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .filter-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .filter-buttons .active {
      background-color: orange;
      color: white;
    }

    .filter-buttons .inactive {
      background-color: white;
      color: black;
    }

    .filter-buttons .inactive:hover {
      background-color: #f0f0f0;
    }

    .employee-card {
      background-color: #2b2736;
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .employee-info {
      line-height: 1.6;
    }

    .employee-info .name {
      font-size: 16px;
      font-weight: bold;
    }

    .employee-info .role {
      font-size: 14px;
      color: #ccc;
    }

    .icons span {
      font-size: 20px;
      margin-left: 18px;
      cursor: pointer;
      display: inline-block;
      transition: color 0.3s;
    }

    .icons span:hover {
      color: orange;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background-color: #2b2736;
      margin: 15% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    .modal h2 {
      color: orange;
      margin-top: 0;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: white;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background-color: #1e1f2a;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input::placeholder {
      color: #aaa;
    }

    .form-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 25px;
    }

    .form-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-primary {
      background-color: orange;
      color: white;
    }

    .btn-primary:hover {
      background-color: #ff8c00;
    }

    .btn-secondary {
      background-color: #666;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #777;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      position: absolute;
      top: 10px;
      right: 20px;
      cursor: pointer;
    }

    .close:hover {
      color: orange;
    }

    .no-employees {
      text-align: center;
      color: #aaa;
      font-style: italic;
      margin-top: 40px;
    }

    .employee-count {
      text-align: center;
      color: #ccc;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    Employee Details
    <button class="add-button" onclick="openAddModal()">+</button>
  </div>

  <div class="container">
    <input class="search-bar" type="text" placeholder="🔍 Search Employees..." onkeyup="searchEmployees()" />

    <div class="filter-buttons">
      <button class="active" onclick="filterEmployees('all')">All Employees</button>
      <button class="inactive" onclick="filterEmployees('inside')">Inside Sales</button>
      <button class="inactive" onclick="filterEmployees('outside')">Outside Sales</button>
    </div>

    <div class="employee-count" id="employeeCount"></div>

    <div id="employeesList">
      <!-- Employee cards will be dynamically generated here -->
    </div>

    <div class="no-employees" id="noEmployees" style="display: none;">
      No employees found matching your criteria.
    </div>
  </div>

  <!-- Add Employee Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAddModal()">&times;</span>
      <h2>Add New Employee</h2>
      <form id="addEmployeeForm">
        <div class="form-group">
          <label for="employeeName">Name:</label>
          <input type="text" id="employeeName" name="name" placeholder="Enter employee name" required>
        </div>
        <div class="form-group">
          <label for="employeeRole">Role:</label>
          <select id="employeeRole" name="role" required>
            <option value="">Select Role</option>
            <option value="Inside Sales">Inside Sales</option>
            <option value="Outside Sales">Outside Sales</option>
          </select>
        </div>
        <div class="form-buttons">
          <button type="submit" class="btn-primary">Add Employee</button>
          <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Sample employee data
    let employees = [
      { id: 1, name: 'sudheer', role: 'Inside Sales' },
      { id: 2, name: 'er', role: 'Inside Sales' },
      { id: 3, name: 'rayudu', role: 'Inside Sales' },
      { id: 4, name: 'usha', role: 'Outside Sales' },
      { id: 5, name: 'manch', role: 'Outside Sales' }
    ];

    let currentFilter = 'all';
    let nextId = 6;

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      displayEmployees();
      updateEmployeeCount();
    });

    // Display employees based on current filter
    function displayEmployees() {
      const employeesList = document.getElementById('employeesList');
      const searchTerm = document.querySelector('.search-bar').value.toLowerCase();
      
      let filteredEmployees = employees.filter(employee => {
        const matchesSearch = employee.name.toLowerCase().includes(searchTerm) || 
                             employee.role.toLowerCase().includes(searchTerm);
        const matchesFilter = currentFilter === 'all' || 
                             (currentFilter === 'inside' && employee.role === 'Inside Sales') ||
                             (currentFilter === 'outside' && employee.role === 'Outside Sales');
        
        return matchesSearch && matchesFilter;
      });

      employeesList.innerHTML = '';
      
      if (filteredEmployees.length === 0) {
        document.getElementById('noEmployees').style.display = 'block';
      } else {
        document.getElementById('noEmployees').style.display = 'none';
        filteredEmployees.forEach(employee => {
          const employeeCard = createEmployeeCard(employee);
          employeesList.appendChild(employeeCard);
        });
      }
      
      updateEmployeeCount();
    }

    // Create employee card element
    function createEmployeeCard(employee) {
      const card = document.createElement('div');
      card.className = 'employee-card';
      card.innerHTML = `
        <div class="employee-info">
          <div class="name">Name: ${employee.name}</div>
          <div class="role">Role: ${employee.role}</div>
        </div>
        <div class="icons">
          <span onclick="deleteEmployee(${employee.id})" title="Delete Employee">🗑</span>
          <span onclick="viewEmployee(${employee.id})" title="View Details">ℹ</span>
        </div>
      `;
      return card;
    }

    // Filter employees
    function filterEmployees(filter) {
      currentFilter = filter;
      
      // Update button styles
      document.querySelectorAll('.filter-buttons button').forEach(btn => {
        btn.className = 'inactive';
      });
      
      if (filter === 'all') {
        document.querySelectorAll('.filter-buttons button')[0].className = 'active';
      } else if (filter === 'inside') {
        document.querySelectorAll('.filter-buttons button')[1].className = 'active';
      } else if (filter === 'outside') {
        document.querySelectorAll('.filter-buttons button')[2].className = 'active';
      }
      
      displayEmployees();
    }

    // Search employees
    function searchEmployees() {
      displayEmployees();
    }

    // Open add employee modal
    function openAddModal() {
      document.getElementById('addModal').style.display = 'block';
      document.getElementById('employeeName').focus();
    }

    // Close add employee modal
    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
      document.getElementById('addEmployeeForm').reset();
    }

    // Add new employee
    document.getElementById('addEmployeeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('employeeName').value.trim();
      const role = document.getElementById('employeeRole').value;
      
      if (name && role) {
        const newEmployee = {
          id: nextId++,
          name: name,
          role: role
        };
        
        employees.push(newEmployee);
        displayEmployees();
        closeAddModal();
        
        // Show success message briefly
        showMessage('Employee added successfully!', 'success');
      }
    });

    // Delete employee
    function deleteEmployee(id) {
      if (confirm('Are you sure you want to delete this employee?')) {
        employees = employees.filter(employee => employee.id !== id);
        displayEmployees();
        showMessage('Employee deleted successfully!', 'success');
      }
    }

    // View employee details (placeholder)
    function viewEmployee(id) {
      const employee = employees.find(emp => emp.id === id);
      if (employee) {
        alert(`Employee Details:\nName: ${employee.name}\nRole: ${employee.role}\nID: ${employee.id}`);
      }
    }

    // Update employee count
    function updateEmployeeCount() {
      const searchTerm = document.querySelector('.search-bar').value.toLowerCase();
      let filteredCount = employees.filter(employee => {
        const matchesSearch = employee.name.toLowerCase().includes(searchTerm) || 
                             employee.role.toLowerCase().includes(searchTerm);
        const matchesFilter = currentFilter === 'all' || 
                             (currentFilter === 'inside' && employee.role === 'Inside Sales') ||
                             (currentFilter === 'outside' && employee.role === 'Outside Sales');
        
        return matchesSearch && matchesFilter;
      }).length;

      const totalCount = employees.length;
      const countText = currentFilter === 'all' 
        ? `Showing ${filteredCount} of ${totalCount} employees`
        : `Showing ${filteredCount} ${currentFilter === 'inside' ? 'Inside Sales' : 'Outside Sales'} employees`;
      
      document.getElementById('employeeCount').textContent = countText;
    }

    // Show temporary message
    function showMessage(message, type) {
      // Create message element
      const messageDiv = document.createElement('div');
      messageDiv.textContent = message;
      messageDiv.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: ${type === 'success' ? '#4CAF50' : '#f44336'};
        color: white;
        border-radius: 8px;
        z-index: 2000;
        animation: slideInRight 0.3s ease-out;
      `;
      
      document.body.appendChild(messageDiv);
      
      // Remove after 3 seconds
      setTimeout(() => {
        messageDiv.style.animation = 'slideOutRight 0.3s ease-out forwards';
        setTimeout(() => messageDiv.remove(), 300);
      }, 3000);
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('addModal');
      if (event.target === modal) {
        closeAddModal();
      }
    }

    // Handle escape key to close modal
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeAddModal();
      }
    });

    // Add CSS for message animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      
      @keyframes slideOutRight {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(100%);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>

</body>
</html>
